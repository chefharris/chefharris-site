# Builds the site and deploys it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # ── Live: the site is served on the custom domain (docs/GO_LIVE.md). ──
  # The build drops the "noindex" tag, opens robots.txt and uses the domain in
  # canonical links and the sitemap. public/CNAME keeps the domain on every deploy.
  SITE_URL: https://chefharris.ch
  BASE_PATH: /
  # Preview mode (github.io project URL) was:
  #   SITE_URL: https://${{ github.repository_owner }}.github.io
  #   BASE_PATH: /chefharris-site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
